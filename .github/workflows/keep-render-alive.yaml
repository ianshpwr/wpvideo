name: Keep Render Alive

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:        # allows manual run

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://YOUR-RENDER-APP.onrender.com/docs > /dev/null
